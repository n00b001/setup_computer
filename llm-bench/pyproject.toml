[project]
name = "llm-bench"
version = "0.1.0"
description = "Automated LLM benchmark: throughput (single/multi user), TTFT, and intelligence"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "tqdm>=4.59",
    "lm-eval[api]>=0.4.5",
    "rich>=13.7",
    "pydantic>=2.0",
    "openai>=3.3.1",
]

[project.scripts]
llm-bench = "llm_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
